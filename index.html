<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>David Yustus — Advocate | Дэвид Юстас — адвокат | דוד יוסטוס — עורך דין</title>
<meta name="description" content="David Yustus — international lawyer. Israel & worldwide. Hebrew, Russian, English.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600&family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b1424;--navy:#111d33;--navy2:#18284a;--gold:#c8a25a;--gold2:#e4c98f;--paper:#f6f2ea;--muted:#8a93a6;--line:rgba(200,162,90,.25)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Inter,system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.65;-webkit-font-smoothing:antialiased}
html[lang=he] body{font-family:Heebo,system-ui,sans-serif}
h1,h2,h3,.serif{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;letter-spacing:.01em}
html[lang=he] h1,html[lang=he] h2,html[lang=he] h3,html[lang=he] .serif{font-family:"Frank Ruhl Libre",serif;font-weight:500}
a{color:inherit;text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px}
/* header */
header{position:fixed;inset:0 0 auto 0;z-index:50;transition:.3s;padding:18px 0}
header.solid{background:rgba(11,20,36,.94);backdrop-filter:blur(10px);padding:12px 0;box-shadow:0 1px 0 var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:20px}
.logo{display:flex;align-items:center;gap:12px;color:#fff}
.mark{width:42px;height:42px;border:1px solid var(--gold);display:grid;place-items:center;font-family:"Cormorant Garamond",serif;font-size:20px;color:var(--gold);letter-spacing:.05em}
.logo b{display:block;font-family:"Cormorant Garamond",serif;font-size:21px;font-weight:600;line-height:1}
html[lang=he] .logo b{font-family:"Frank Ruhl Libre",serif}
.logo small{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold2)}
.links{display:flex;gap:28px;color:#d7dbe4;font-size:14px}
.links a:hover{color:var(--gold2)}
.langs{display:flex;border:1px solid var(--line)}
.langs button{background:none;border:0;color:#cfd5e0;padding:7px 11px;font:500 12px Inter;cursor:pointer;letter-spacing:.08em}
.langs button.on{background:var(--gold);color:var(--ink)}
.burger{display:none;background:none;border:0;color:#fff;font-size:24px;cursor:pointer}
/* hero */
.hero{background:radial-gradient(1200px 600px at 80% 20%,#1d3058 0%,transparent 60%),linear-gradient(160deg,var(--ink),var(--navy) 60%,#0d1729);color:#fff;padding:150px 0 90px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:80px 80px;opacity:.18;mask-image:linear-gradient(to bottom,#000,transparent 85%)}
.hgrid{display:grid;grid-template-columns:1.15fr .85fr;gap:60px;align-items:center;position:relative}
.eyebrow{display:inline-flex;align-items:center;gap:12px;color:var(--gold2);font-size:12.5px;letter-spacing:.24em;text-transform:uppercase;margin-bottom:22px}
.eyebrow:before{content:"";width:38px;height:1px;background:var(--gold)}
.hero h1{font-size:clamp(42px,5.6vw,74px);line-height:1.04;margin-bottom:22px}
.hero h1 em{font-style:italic;color:var(--gold2)}
html[lang=he] .hero h1 em{font-style:normal}
.hero p.lead{font-size:18px;color:#c3cad8;max-width:560px;margin-bottom:36px;font-weight:300}
.btns{display:flex;gap:14px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:10px;padding:15px 28px;font-weight:500;font-size:14.5px;letter-spacing:.03em;transition:.25s;border:1px solid var(--gold)}
.btn.primary{background:var(--gold);color:var(--ink)}
.btn.primary:hover{background:var(--gold2)}
.btn.ghost{color:#fff}
.btn.ghost:hover{background:rgba(200,162,90,.12)}
.facts{display:flex;gap:40px;margin-top:54px;padding-top:28px;border-top:1px solid var(--line)}
.facts div b{display:block;font-family:"Cormorant Garamond",serif;font-size:30px;color:var(--gold2);font-weight:600;line-height:1.1}
.facts div span{font-size:13px;color:var(--muted)}
.portrait{position:relative;justify-self:center}
.portrait img{width:100%;max-width:420px;aspect-ratio:1;object-fit:cover;display:block;filter:saturate(.92) contrast(1.03)}
.portrait:before{content:"";position:absolute;inset:-18px 18px 18px -18px;border:1px solid var(--gold);z-index:-0}
html[dir=rtl] .portrait:before{inset:-18px -18px 18px 18px}
.portrait .tag{position:absolute;z-index:2;bottom:-22px;inset-inline-end:-22px;background:var(--paper);color:var(--ink);padding:16px 22px;box-shadow:0 20px 40px rgba(0,0,0,.3)}
.portrait .tag b{display:block;font-family:"Cormorant Garamond",serif;font-size:20px}
html[lang=he] .portrait .tag b{font-family:"Frank Ruhl Libre",serif}
.portrait .tag span{font-size:12px;color:#556;letter-spacing:.1em;text-transform:uppercase}
.portrait img{position:relative;z-index:1}
/* sections */
section{padding:110px 0}
.shead{max-width:680px;margin-bottom:60px}
.shead .eyebrow{color:#9a7a3c}
.shead h2{font-size:clamp(34px,4vw,52px);line-height:1.1;margin-bottom:16px}
.shead p{color:#4c566a;font-size:17px}
.about{display:grid;grid-template-columns:.9fr 1.1fr;gap:70px;align-items:start}
.about .quote{font-family:"Cormorant Garamond",serif;font-size:30px;line-height:1.3;font-style:italic;border-inline-start:2px solid var(--gold);padding-inline-start:28px;color:var(--navy2)}
html[lang=he] .about .quote{font-family:"Frank Ruhl Libre",serif;font-style:normal;font-size:26px}
.about .txt p{margin-bottom:18px;color:#39425a;font-size:16.5px}
.vals{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);margin-top:34px;border:1px solid var(--line)}
.vals div{background:var(--paper);padding:22px}
.vals b{display:block;font-size:15px;margin-bottom:4px}
.vals span{font-size:13.5px;color:#5d667a}
.dark{background:var(--ink);color:#fff}
.dark .shead p{color:#aab2c3}
.dark .shead .eyebrow{color:var(--gold2)}
.areas{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
.area{background:var(--ink);padding:38px 32px;transition:.3s;position:relative}
.area:hover{background:var(--navy)}
.area .n{font-family:"Cormorant Garamond",serif;color:var(--gold);font-size:15px;letter-spacing:.1em}
.area h3{font-size:25px;margin:14px 0 10px}
.area p{color:#a6aebf;font-size:14.5px}
.globe{display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:center}
.regions{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.regions div{border:1px solid #ddd3c0;padding:20px;background:#fff}
.regions b{display:block;font-size:15px;margin-bottom:3px}
.regions span{font-size:13.5px;color:#667}
.mapbox{background:var(--navy);aspect-ratio:1.25;position:relative;overflow:hidden}
.mapbox svg{width:100%;height:100%}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:30px;counter-reset:s}
.step{border-top:1px solid var(--gold);padding-top:24px}
.step:before{counter-increment:s;content:"0" counter(s);font-family:"Cormorant Garamond",serif;font-size:42px;color:var(--gold);display:block;line-height:1;margin-bottom:14px}
.step b{display:block;font-size:17px;margin-bottom:8px}
.step p{font-size:14.5px;color:#525c70}
.contact{display:grid;grid-template-columns:1fr 1fr;gap:60px}
.cinfo a,.cinfo div.row{display:flex;gap:18px;align-items:flex-start;padding:22px 0;border-bottom:1px solid var(--line)}
.cinfo .ic{width:44px;height:44px;flex:none;border:1px solid var(--gold);display:grid;place-items:center;color:var(--gold2)}
.cinfo small{display:block;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.cinfo b{font-size:18px;font-weight:500}
.cinfo a:hover b{color:var(--gold2)}
form{background:var(--navy);padding:40px;border:1px solid var(--line)}
form h3{font-size:28px;margin-bottom:8px}
form p{color:#aab2c3;font-size:14px;margin-bottom:24px}
label{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
input,select,textarea{width:100%;background:transparent;border:0;border-bottom:1px solid #34456a;color:#fff;padding:10px 0 12px;font:inherit;font-size:15.5px;margin-bottom:22px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--gold)}
select option{color:#000}
textarea{resize:vertical;min-height:90px}
form .btn{width:100%;justify-content:center;cursor:pointer;font-family:inherit}
footer{background:#070d18;color:#7d8699;padding:36px 0;font-size:13px}
footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
.wa{position:fixed;bottom:24px;inset-inline-end:24px;width:58px;height:58px;border-radius:50%;background:#25d366;display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:60;transition:.2s}
.wa:hover{transform:scale(1.07)}
.reveal{opacity:0;transform:translateY(26px);transition:opacity .8s,transform .8s}
.reveal.in{opacity:1;transform:none}
@media(max-width:960px){
 .links{display:none}.links.open{display:flex;position:absolute;top:100%;inset-inline:0;flex-direction:column;background:var(--ink);padding:24px 28px;gap:18px}
 .burger{display:block}
 .hgrid,.about,.globe,.contact{grid-template-columns:1fr;gap:50px}
 .portrait{order:-1;max-width:320px}
 .areas{grid-template-columns:1fr}
 .steps{grid-template-columns:1fr 1fr}
 .vals{grid-template-columns:1fr}
 .facts{gap:24px;flex-wrap:wrap}
 section{padding:80px 0}
 .hero{padding:120px 0 70px}
}
@media(max-width:560px){.steps,.regions{grid-template-columns:1fr}.logo small{display:none}}
</style>
</head>
